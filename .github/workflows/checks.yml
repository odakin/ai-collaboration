name: checks
on:
  push:
    paths: ['scripts/**', 'conventions/**', '.github/workflows/checks.yml']
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install pyyaml numpy scipy mpmath sympy
      - run: python3 scripts/generate-script-index.py --check
      - run: |
          set -e
          for s in scripts/*.py; do python3 "$s" --selftest; done
