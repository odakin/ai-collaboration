name: checks
on:
  push:
    paths: ['scripts/**', 'conventions/**', '.github/workflows/checks.yml']
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml numpy scipy mpmath
      - run: for s in scripts/*.py; do python3 "$s" --selftest; done
